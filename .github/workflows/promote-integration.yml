name: Promote Integration submodule
run-name: Promote Integration ${{ inputs.wrapper_sha }} / wss-${{ fromJSON(inputs.approval_json).candidate.run_id }}-${{ fromJSON(inputs.approval_json).candidate.artifact_id }}
on:
  workflow_dispatch:
    inputs:
      wrapper_sha: {required: true, type: string}
      wrapper_pr: {required: true, type: string}
      approval_json: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: matlab-promote-cli-dev
  cancel-in-progress: false
jobs:
  promote:
    if: vars.WSS_MATLAB_PROPAGATION_ENABLED == 'true'
    name: Create verified dependency PR
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Require enabled baseline and trusted dev workflow
        shell: pwsh
        run: |
          $config=Get-Content source/.github/matlab-ci.json -Raw | ConvertFrom-Json
          if (!$config.baseline_ready -or $env:GITHUB_REF -cne 'refs/heads/dev' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw 'Native candidate promotion activation remains pending.' }
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            Matlab_WSS_Integration_Lib
            CLI_Matlab_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Check out tools only from trusted wrapper dev
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Matlab_WSS_Integration_Lib
          ref: dev
          path: promotion-tools
          persist-credentials: false
      - name: Validate producer and no-op before dispatch credentials
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
          WRAPPER_MERGE_SHA: ${{ inputs.wrapper_sha }}
          WRAPPER_PR: ${{ inputs.wrapper_pr }}
        run: ./promotion-tools/.github/scripts/Prepare-MatlabPromotion.ps1 -Role cli -RepositoryRoot "$env:GITHUB_WORKSPACE/source" -WorkRoot "$env:RUNNER_TEMP/matlab-validation" -ApprovalJson $env:APPROVAL_JSON -WrapperMergeSha $env:WRAPPER_MERGE_SHA -WrapperPr $env:WRAPPER_PR -ValidateOnly
      - uses: actions/create-github-app-token@v2
        if: steps.candidate.outputs.no_op == 'false'
        id: preflight
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CLI_Matlab_WSS_Application
          permission-actions: write
      - name: Require exact source-bound native preflights
        id: prepare
        if: steps.candidate.outputs.no_op == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          MATLAB_PREFLIGHT_TOKEN: ${{ steps.preflight.outputs.token }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
          WRAPPER_MERGE_SHA: ${{ inputs.wrapper_sha }}
          WRAPPER_PR: ${{ inputs.wrapper_pr }}
        run: ./promotion-tools/.github/scripts/Prepare-MatlabPromotion.ps1 -Role cli -RepositoryRoot "$env:GITHUB_WORKSPACE/source" -WorkRoot "$env:RUNNER_TEMP/matlab-promotion" -ApprovalJson $env:APPROVAL_JSON -WrapperMergeSha $env:WRAPPER_MERGE_SHA -WrapperPr $env:WRAPPER_PR
      - uses: actions/create-github-app-token@v2
        if: steps.prepare.outputs.no_op == 'false'
        id: write
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CLI_Matlab_WSS_Application
          permission-contents: write
          permission-pull-requests: write
      - name: Create or reuse exact constrained PR; never merge
        if: steps.prepare.outputs.no_op == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          MATLAB_PUSH_TOKEN: ${{ steps.write.outputs.token }}
        run: ./promotion-tools/.github/scripts/Publish-MatlabPromotion.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE/source" -WorkRoot "$env:RUNNER_TEMP/matlab-promotion"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-promotion-record
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/matlab-promotion/approval.json
            ${{ runner.temp }}/matlab-promotion/prepared.json
            ${{ runner.temp }}/matlab-promotion/projection.json
            ${{ runner.temp }}/matlab-validation/prepared.json
