name: CLI CI
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  general-conformance:
    name: CLI general conformance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify read-only receipt rejection fixtures
        shell: pwsh
        run: |
          node --test .github/scripts/tests/ReceiptGuards.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Receipt guards failed.' }
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: cli
          purpose: general
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-general-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  platform-compatibility:
    name: CLI platform compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: cli
          purpose: compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-compatibility-${{ matrix.name }}-evidence
          path: artifacts/ci/
          if-no-files-found: warn
