name: CLI CI
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-artifact-diagnostic:
    name: Mac packaged BLE diagnostic (arm64)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          path: source
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Matlab_WSS_Integration_Lib
          ref: 5b1e0ffabf667c5b72dec4165fdd61ca88ef1c16
          persist-credentials: false
          path: tools
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - uses: ./tools/.github/actions/mac-artifact-diagnostic
        with:
          read-token: ${{ steps.read.outputs.token }}
          role: cli
          source-root: ${{ github.workspace }}/source
          wrapper-root: ${{ github.workspace }}/source/external/wss-matlab-wrapper
          tools-root: ${{ github.workspace }}/tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-mac-packaged-ble-diagnostic
          path: ${{ runner.temp }}/matlab-mac-artifact-diagnostic/evidence/
          if-no-files-found: warn
  general-conformance:
    name: CLI general conformance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify read-only receipt rejection fixtures
        shell: pwsh
        run: |
          node --test .github/scripts/tests/ReceiptGuards.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Receipt guards failed.' }
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: cli
          purpose: general
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-general-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  platform-compatibility:
    name: CLI platform compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: cli
          purpose: compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-compatibility-${{ matrix.name }}-evidence
          path: artifacts/ci/
          if-no-files-found: warn
