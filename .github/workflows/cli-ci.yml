name: CLI CI
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  general-conformance:
    name: CLI general conformance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the pinned wrapper host
        shell: pwsh
        run: |
          dotnet build external/wss-matlab-wrapper/managed/Wss.Matlab.Managed.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned wrapper host build failed.' }
      - name: Set up MATLAB using normal public-project licensing
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Run production CLI behavior and canonical Core scenarios
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('ci'); runCliCi('general');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-general-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  platform-compatibility:
    name: CLI platform compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the pinned wrapper host
        shell: pwsh
        run: |
          dotnet build external/wss-matlab-wrapper/managed/Wss.Matlab.Managed.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned wrapper host build failed.' }
      - name: Set up MATLAB using normal public-project licensing
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Verify CLI paths and platform loading separately from behavior
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('ci'); runCliCi('compatibility');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-compatibility-${{ matrix.name }}-evidence
          path: artifacts/ci/
          if-no-files-found: warn
