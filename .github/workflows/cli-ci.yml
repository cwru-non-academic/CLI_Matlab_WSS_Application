name: CLI CI
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  general-conformance:
    name: CLI general conformance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: 7712e609f44ffc3425df3c067be8e2e080506f59
          path: .receipt-contract
          persist-credentials: false
      - name: Verify immutable shared release contract
        shell: pwsh
        env:
          RECEIPT_CORE_ROOT: ${{ github.workspace }}/.receipt-contract
        run: |
          node --test .github/scripts/tests/ReviewedCoreContract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed Core contract differs from MATLAB receivers.' }
      - name: Verify read-only receipt rejection fixtures
        shell: pwsh
        run: |
          node --test .github/scripts/tests/ReceiptGuards.test.mjs .github/scripts/tests/CliProfileBootstrap.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Receipt guards failed.' }
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: cli
          purpose: general
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-general-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  platform-compatibility:
    name: CLI platform compatibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run reusable native MATLAB validation
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: cli
          purpose: compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-compatibility-${{ matrix.name }}-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  macos-native:
    name: CLI platform compatibility native (macOS ${{ matrix.arch }}, ${{ matrix.release }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, os: macos-15, platform: MACA64, release: R2026b}
          - {arch: x86_64, os: macos-15-intel, platform: MACI64, release: R2025b}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Matlab_WSS_Integration_Lib
          ref: 34c0ee48a7cb373e8a892b4ad98904e9c2342ea7
          path: .mac-tools
          persist-credentials: false
      - name: Run native committed-state MATLAB compatibility
        uses: ./.github/actions/native-matlab
        with:
          root: .
          role: cli
          purpose: compatibility
          matlab-release: ${{ matrix.release }}
          expected-platform: ${{ matrix.platform }}
      - name: Bind the native architecture and runtime version
        shell: pwsh
        run: ./.mac-tools/.github/scripts/Write-MatlabMacLane.ps1 -InputPath artifacts/ci/compatibility.json -Architecture ${{ matrix.arch }} -AllowLegacy -OutputPath "$env:RUNNER_TEMP/mac-lane/compatibility.json"
      - uses: actions/create-github-app-token@v2
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Verify preparation payload BLE ABI without radio access
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.mac-tools/.github/actions/mac-artifact-diagnostic
        with:
          read-token: ${{ steps.read.outputs.token }}
          role: cli
          source-root: ${{ github.workspace }}
          wrapper-root: ${{ github.workspace }}/external/wss-matlab-wrapper
          tools-root: ${{ github.workspace }}/.mac-tools
          matlab-release: ${{ matrix.release }}
          expected-platform: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-compatibility-macOS-a${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/mac-lane/compatibility.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: cli-mac-packaged-ble-diagnostic-a${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/matlab-mac-artifact-diagnostic/evidence/
          if-no-files-found: warn
  macos-compatibility:
    name: CLI platform compatibility (macOS)
    if: always()
    needs: [macos-native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require both native macOS lanes
        shell: pwsh
        env:
          MACOS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $needs = $env:MACOS_NEEDS_JSON | ConvertFrom-Json
          if ($needs.'macos-native'.result -cne 'success') { throw 'A native macOS lane failed, was skipped or cancelled.' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Matlab_WSS_Integration_Lib
          ref: 34c0ee48a7cb373e8a892b4ad98904e9c2342ea7
          path: .mac-tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-compatibility-macOS-a${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/mac-lanes
      - name: Require complete native evidence from both architectures
        shell: pwsh
        env:
          MACOS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: ./.mac-tools/.github/scripts/Complete-MatlabMacCoverage.ps1 -EvidenceRoot "$env:RUNNER_TEMP/mac-lanes" -ArtifactPrefix 'cli-compatibility-macOS-a${{ github.run_attempt }}' -AllowLegacy -OutputPath "$env:RUNNER_TEMP/mac-coverage/compatibility.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-compatibility-macOS-evidence
          path: ${{ runner.temp }}/mac-coverage/compatibility.json
          if-no-files-found: error
